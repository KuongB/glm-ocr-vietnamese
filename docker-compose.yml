version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=OCR Service API
      - VERSION=1.0.0
      - DEBUG=True
      - CORS_ORIGINS=http://localhost:3000,http://frontend
      - HF_REPO_ID=KuongB/glm-ocr-vietnamese
      - MAX_IMAGE_SIZE=10485760
      - USE_LOCAL_MODEL=False
    volumes:
      - ./backend:/app
    networks:
      - ocr-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend
    environment:
      - VITE_API_URL=http://localhost:8000/api
    networks:
      - ocr-network
    restart: unless-stopped

networks:
  ocr-network:
    driver: bridge

volumes:
  backend_data:
